let currentChapterId = "";
let now = 0, score = 0, questions = [];
const TOTAL_Q = 10;

// 音效
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, dur){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function playCorrect(){ playSound(880, 0.15); setTimeout(()=>playSound(1320, 0.2), 100); }
function playWrong(){ playSound(220, 0.3); }

// 语音播报
let zhVoice = null;
function loadVoices(){
  const voices = window.speechSynthesis.getVoices();
  zhVoice = voices.find(v=>v.name.includes("Xiaoxiao")) || 
            voices.find(v=>v.name.includes("Xiaoyi")) ||
            voices.find(v=>v.lang==="zh-CN");
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();
function speakText(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  if(zhVoice) u.voice = zhVoice;
  u.rate = 1.0;
  u.pitch = 1.3;
  u.volume = 0.8;
  window.speechSynthesis.speak(u);
}

//随机抽题
function shuffle(arr){
  const newArr = [...arr];
  for(let i=newArr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [newArr[i],newArr[j]] = [newArr[j],newArr[i]];
  }
  return newArr;
}

//展示章节列表
function showChapter(unitId){
  const data = chapterData[unitId];
  document.getElementById("chapterUnitTitle").innerText = data.title;
  const listWrap = document.getElementById("chapterList");
  listWrap.innerHTML = "";
  //返回按钮
  const backDiv = document.createElement("div");
  backDiv.className = "back-btn";
  backDiv.innerText = "← 返回单元选择";
  backDiv.onclick = ()=>switchPage("pageHome");
  listWrap.appendChild(backDiv);
  //渲染章节卡片
  data.chapters.forEach(ch=>{
    const div = document.createElement("div");
    div.className = "card";
    const qCount = questionBank[ch.id].length;
    div.innerHTML = `<div class="img-area">📖</div><h3>${ch.name}</h3><p>题库${qCount}题，每次随机抽10题</p>`;
    div.onclick = ()=>startQuiz(ch.id);
    listWrap.appendChild(div);
  })
  switchPage("pageChapter");
}

//开始刷题
function startQuiz(chapterId){
  currentChapterId = chapterId;
  //从题库随机抽10题
  questions = shuffle(questionBank[chapterId]).slice(0, TOTAL_Q);
  now = 0; score = 0;
  renderQuestion();
  switchPage("pageQuiz");
}

function renderQuestion(){
  const item = questions[now];
  document.getElementById("qIndex").innerText = (now+1) + "/" + TOTAL_Q;
  document.getElementById("scoreShow").innerText = score;
  document.getElementById("question").innerText = item.q;
  // 隐藏解析
  document.getElementById("explainBox").style.display = "none";
  const optWrap = document.getElementById("optionsWrap");
  optWrap.innerHTML = "";
  item.opt.forEach(opt=>{
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = opt;
    div.onclick = ()=>selectAnswer(opt[0], div, item);
    optWrap.appendChild(div);
  })
}

function selectAnswer(sel, el, item){
  const correctAns = item.ans;
  //显示对错
  const allOpt = document.querySelectorAll(".option");
  allOpt.forEach(o=>{
    if(o.innerText[0] === correctAns) o.classList.add("correct");
    if(o === el && sel !== correctAns) o.classList.add("wrong");
    o.style.pointerEvents = "none";
  });

  // 显示解析
  const explainBox = document.getElementById("explainBox");
  explainBox.style.display = "block";
  explainBox.innerText = "📖 解析：" + (item.explain || "本题考察该章节核心知识点");

  setTimeout(()=>{
    if(sel === correctAns){
      score += 10;
      playCorrect();
      speakText("答对了！");
    }else{
      playWrong();
      speakText("答错了！");
    }
    now++;
    if(now >= TOTAL_Q){ endGame(); return; }
    renderQuestion();
  }, 2500);
}

function endGame(){
  switchPage("pageResult");
  let tip = "";
  if(score === 100){ 
    tip="🌟太棒了！满分！本章节知识点全部掌握！";
    speakText("太棒了！满分！你真是生物小能手！");
  }
  else if(score >= 80) tip="📖掌握不错，个别知识点需要复盘";
  else if(score >= 60) tip="💡基础熟悉，重点巩固易错题";
  else tip="🌱继续加油，梳理课本概念";
  document.getElementById("resultText").innerText=`总分：${score}分 / 100分\n${tip}`;
}

function retryChapter(){
  startQuiz(currentChapterId);
}

function backHome(){
  switchPage("pageHome");
}

//页面切换工具
function switchPage(pageId){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(pageId).classList.add("active");
}
</script>
